name: Atualizar índice ISM-IPCA

on:
  schedule:
    # dia 15 de cada mês, 13h UTC (10h em Brasília).
    # O IPCA sai por volta do dia 10; o dia 15 dá folga.
    - cron: "0 13 15 * *"
  workflow_dispatch:        # permite rodar manualmente pelo site do GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rodar o pipeline
        run: python build.py

      - name: Commitar se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Nada mudou, IBGE provavelmente ainda não publicou."
            exit 0
          fi
          git commit -m "Atualiza série ISM-IPCA ($(date +%Y-%m))"
          git push
