name: Atualizar ISMI Brasil

on:
  schedule:
    # Dia 15 de cada mês, 12:00 UTC (09:00 em Brasília)
    - cron: "0 12 15 * *"
  # Permite rodar manualmente: Actions > Atualizar ISMI Brasil > Run workflow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ismi-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependências
        run: pip install -r requirements.txt

      # AJUSTE: troque pelo comando que roda seu pipeline
      # (coleta SIDRA via sidrapy, modelos AR, momentum, geração do site)
      - name: Rodar pipeline
        run: python pipeline.py

      # AJUSTE: troque data/ e docs/ pelas pastas que o pipeline altera
      - name: Commit dos dados atualizados
        run: |
          git config user.name "Davi Speck"
          git config user.email "davispeckr@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Sem dados novos (IPCA do mês ainda não publicado no SIDRA?)."
          else
            git commit -m "Atualização mensal ISMI Brasil $(date -u +%Y-%m)"
            git push
          fi
