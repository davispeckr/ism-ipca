<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Momentum de Choque Inflacionário no IPCA</title>
<meta name="description" content="Índice de difusão direcional dos choques de inflação nos subitens do IPCA, 2009-2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#F3F4F6; --papel2:#E7E9ED; --tinta:#10161D; --tinta3:#59626D;
  --alta:#B0402A; --baixa:#1D5480; --regua:#CFD3DA;
  --alta-t:rgba(176,64,42,.15); --baixa-t:rgba(29,84,128,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Newsreader,Georgia,serif;font-size:17px;line-height:1.6;font-weight:300}
.wrap{max-width:940px;margin:0 auto;padding:clamp(30px,5vw,72px) clamp(18px,4vw,42px) 90px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

/* cabeçalho */
.serie{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--tinta3);margin:0 0 20px;padding-bottom:14px;
  border-bottom:2px solid var(--tinta)}
h1{font-family:Newsreader,serif;font-weight:600;font-size:clamp(29px,4.6vw,47px);
  line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance;
  font-variation-settings:"opsz" 60}
.autores{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--tinta3);
  margin:16px 0 0;letter-spacing:.03em}

/* resumo */
.resumo{margin:34px 0 0;padding:24px 28px;background:var(--papel2);border-left:2.5px solid var(--tinta)}
.resumo h2{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--tinta3);margin:0 0 12px;font-weight:500}
.resumo p{margin:0 0 12px;font-size:16.5px;max-width:70ch}
.resumo p:last-child{margin-bottom:0}
.resumo em{font-style:italic}

/* leitura corrente */
.corrente{margin:52px 0 0;border-top:1px solid var(--regua);padding-top:26px}
.rot{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.19em;
  text-transform:uppercase;color:var(--tinta3);margin:0 0 4px}
.frase{font-size:19px;max-width:66ch;margin:0 0 26px}
.frase b{font-weight:600}
.barra-topo{display:flex;justify-content:space-between;
  font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tinta3);margin-bottom:9px}
.barra{position:relative;height:52px;display:flex;align-items:center}
.barra::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--tinta);z-index:3}
.lado{flex:1;height:34px;display:flex;position:relative}
.lado.esq{justify-content:flex-end}
.trilho{position:absolute;inset:0;border-top:1px solid var(--regua);border-bottom:1px solid var(--regua)}
.fill{height:100%;width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}
.fill.b{background:var(--baixa)} .fill.a{background:var(--alta)}
.leitura{display:flex;justify-content:space-between;margin-top:11px;
  font-family:"JetBrains Mono",monospace;font-size:12px}
.leitura b{font-weight:700;font-size:21px;display:block;letter-spacing:-.02em}
.leitura .l{text-align:left;color:var(--baixa)} .leitura .r{text-align:right;color:var(--alta)}
.leitura .c{text-align:center}
.leitura span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta3)}

/* controles */
.controles{display:flex;flex-wrap:wrap;gap:24px;margin:48px 0 8px;
  border-top:1px solid var(--regua);border-bottom:1px solid var(--regua);padding:17px 0}
.grupo{display:flex;flex-direction:column;gap:6px}
.grupo>span{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--tinta3)}
.seg{display:flex;border:1px solid var(--tinta);width:max-content}
.seg button{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:6px 11px;
  background:none;border:0;border-right:1px solid var(--regua);cursor:pointer;color:var(--tinta3)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
.seg button:focus-visible{outline:2px solid var(--alta);outline-offset:2px}

/* figuras */
figure{margin:42px 0 0}
figcaption{font-size:14px;color:var(--tinta3);max-width:70ch;margin-top:12px}
figcaption b{font-weight:600;color:var(--tinta);font-family:"JetBrains Mono",monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:5px}
svg{display:block;width:100%;height:auto;overflow:visible}
.eixo{font-family:"JetBrains Mono",monospace;font-size:10px;fill:var(--tinta3)}
.grade{stroke:var(--regua);stroke-width:.7}
.zero{stroke:var(--tinta);stroke-width:1.1}
.crosshair{stroke:var(--tinta);stroke-width:.8;stroke-dasharray:2 3;opacity:0}
.hud{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--tinta3);
  min-height:19px;margin-bottom:10px;display:flex;gap:17px;flex-wrap:wrap}
.hud b{color:var(--tinta);font-weight:500}
.hud .a{color:var(--alta)} .hud .b{color:var(--baixa)}
.leg{display:flex;gap:17px;font-family:"JetBrains Mono",monospace;font-size:10.5px;
  color:var(--tinta3);margin-top:9px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* método */
.metodo{margin-top:70px;border-top:2px solid var(--tinta);padding-top:26px}
.metodo h2{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.19em;
  text-transform:uppercase;margin:0 0 22px;font-weight:500;color:var(--tinta3)}
.metodo h3{font-family:Newsreader,serif;font-weight:600;font-size:18px;margin:26px 0 6px}
.metodo h3:first-of-type{margin-top:0}
.metodo p{margin:0 0 10px;font-size:15.5px;max-width:72ch;color:#2C343C}
.eq{font-family:"JetBrains Mono",monospace;font-size:13px;background:var(--papel2);
  padding:13px 17px;margin:13px 0;overflow-x:auto;white-space:nowrap;color:var(--tinta)}
.ref{font-size:14px;color:var(--tinta3);max-width:72ch;margin:0 0 7px;padding-left:26px;text-indent:-26px}
.ref i{font-style:italic}
.baixar{margin-top:30px}
.baixar button{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:9px 17px;
  background:var(--tinta);color:var(--papel);border:0;cursor:pointer;letter-spacing:.05em}
.baixar button:focus-visible{outline:2px solid var(--alta);outline-offset:3px}
@media (max-width:680px){
  body{font-size:16px}
  .barra-topo{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
  .barra-topo span:nth-child(2){grid-column:1/-1;grid-row:2;text-align:center;padding-top:3px}
  .barra-topo span:nth-child(3){text-align:right}
  .resumo{padding:19px 20px}
  .leitura b{font-size:17px}
  .eixo{font-size:11px}
  .eq{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
