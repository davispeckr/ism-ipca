<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inflation Shock Momentum Index (ISMI) · IPCA</title>
<meta name="description" content="Índice de difusão direcional dos choques de inflação nos subitens do IPCA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#FFFFFF; --ink:#111214; --muted:#6E7278; --hair:#E4E6E8; --grid:#E9EBED;
  --alta:#D8382C; --baixa:#1D5FA0; --alta-t:rgba(216,56,44,.10); --baixa-t:rgba(29,95,160,.10);
  --chip:#F4F5F6; --partnr:#6D4AFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.6;
  font-feature-settings:"tnum" 1}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 10px}
.topo h1{margin:0;flex:1}
.langbar{display:flex;gap:4px;flex-shrink:0;padding-top:6px}
.lang{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;
  color:var(--muted);background:none;border:1px solid var(--hair);border-radius:999px}
.lang:hover{color:var(--ink);border-color:#CFD3D8}
.lang.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.lang:focus-visible{outline:2px solid var(--partnr);outline-offset:2px}
.wrap{max-width:1150px;margin:0 auto;padding:26px clamp(16px,3.5vw,40px) 80px}

h1{font-family:Newsreader,Georgia,serif;font-weight:700;font-variation-settings:"opsz" 46;
  font-size:clamp(28px,4.4vw,44px);line-height:1.06;letter-spacing:-.015em;margin:0 0 10px;
  text-wrap:balance}
.standfirst{font-size:17px;color:#3A3E44;max-width:76ch;margin:0}
.standfirst a{color:inherit;text-decoration:underline;text-decoration-color:#B9BDC2;text-underline-offset:3px}
.standfirst a:hover{text-decoration-color:var(--ink)}
.byline{font-size:12.5px;color:var(--muted);margin:15px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.byline a{color:inherit;text-decoration:none}
.byline .who{font-size:13px;font-weight:700;color:#fff;background:var(--ink);
  padding:5px 14px;border-radius:999px;letter-spacing:.01em}
.byline .who:hover{background:#000}
.byline .who.partnr{background:var(--partnr)}
.byline .who.partnr:hover{background:#5b3ae0}

.comoler{margin:26px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--alta);
  font-size:14px;color:#3A3E44;max-width:82ch;line-height:1.65}
.comoler b{font-weight:600;color:var(--ink)}

/* controles */
.controles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:18px 36px;margin:28px 0 6px;padding:18px 0 4px;
  border-top:1px solid var(--ink)}
.grupo{display:flex;flex-direction:column;gap:8px}
.grupo>a{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border-bottom:1px dotted #B9BDC2;width:max-content;cursor:help}
.grupo>a:hover{color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font:inherit;font-size:12.5px;font-weight:500;padding:6px 14px;cursor:pointer;
  color:#3A3E44;background:var(--bg);border:1px solid #CFD3D8;border-radius:999px;white-space:nowrap}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--alta);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#3A3E44;user-select:none;padding-top:26px}
.toggle input{accent-color:var(--ink);width:15px;height:15px;cursor:pointer}
.toggle a{color:inherit;text-decoration:none;border-bottom:1px dotted #B9BDC2;cursor:help}
.toggle a:hover{color:var(--ink)}

/* barra de pressao */
.corrente{margin:24px 0 0}
.barra-topo{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.barra{position:relative;height:38px;display:flex;align-items:center}
.barra::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);z-index:3}
.lado{flex:1;height:24px;display:flex;position:relative}
.lado.esq{justify-content:flex-end}
.trilho{position:absolute;inset:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.fill{height:100%;width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
.fill.b{background:var(--baixa)} .fill.a{background:var(--alta)}
.leitura{display:flex;justify-content:space-between;margin-top:9px;font-size:12px}
.leitura b{font-weight:700;font-size:19px;display:block;letter-spacing:-.01em}
.leitura .l{color:var(--baixa)} .leitura .r{text-align:right;color:var(--alta)} .leitura .c{text-align:center}
.leitura span{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* figura e slider */
figure{margin:30px 0 0}
.figtit{font-size:15px;font-weight:700;margin:0 0 10px}
svg{display:block;width:100%;height:auto;overflow:visible}
.eixo{font-size:11px;fill:var(--muted);font-family:Inter,sans-serif}
.eixo.b{font-weight:600}
.grade{stroke:var(--grid);stroke-width:1}
.zero{stroke:#9CA1A7;stroke-width:1.2}
.endlab{font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:3.5px}
.crosshair{stroke:var(--ink);stroke-width:.9;stroke-dasharray:2 3;opacity:0}
.hud{font-size:12.5px;color:var(--muted);min-height:19px;margin:0 0 8px;display:flex;gap:16px;flex-wrap:wrap}
.hud b{color:var(--ink);font-weight:600}
.hud .a{color:var(--alta)} .hud .b2{color:var(--baixa)}
.anos{display:flex;align-items:center;gap:14px;margin:10px 0 0}
.anos .yl{font-size:12.5px;font-weight:600;min-width:38px}
.anos .yl.r{text-align:right}
.range{position:relative;flex:1;height:30px}
.range .track,.range .fillr{position:absolute;top:13px;height:3px;border-radius:2px}
.range .track{left:0;right:0;background:var(--hair)}
.range .fillr{background:var(--ink)}
.range input[type=range]{position:absolute;inset:0;width:100%;margin:0;background:none;
  -webkit-appearance:none;appearance:none;pointer-events:none;height:30px}
.range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
  width:15px;height:15px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink);cursor:grab}
.range input[type=range]::-moz-range-thumb{pointer-events:auto;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2.5px solid var(--ink);cursor:grab}

/* rodape */
.rodape{margin-top:60px;border-top:3px solid var(--ink);padding-top:26px;max-width:none}
.rodape>div+div{margin-top:44px;padding-top:30px;border-top:1px solid var(--hair)}
.rodape h2{font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:700;margin:0 0 14px;
  letter-spacing:-.01em}
.rodape h3{font-size:14px;font-weight:600;margin:18px 0 5px;scroll-margin-top:20px}
.rodape p{margin:0 0 10px;font-size:14px;color:#3A3E44;max-width:92ch}
.eqrow{margin:14px 0;overflow-x:auto;max-width:92ch}
.eqrow .katex{font-size:1.06em}
.ref{font-size:12.5px;color:var(--muted);margin:0 0 6px;padding-left:22px;text-indent:-22px}
.ref i{font-style:italic}
.baixar{margin-top:24px}
.baixar button{font:inherit;font-size:12.5px;font-weight:600;padding:10px 18px;
  background:var(--ink);color:var(--bg);border:0;border-radius:8px;cursor:pointer}
.baixar button:hover{background:#000}
.fonte{font-size:12px;color:var(--muted);margin-top:40px;padding-top:12px;border-top:1px solid var(--hair)}
:target{background:#FFF6E8;transition:background 1.5s}

@media (max-width:680px){
  .topo{flex-direction:column-reverse;gap:12px}
  .langbar{align-self:flex-end;padding-top:0}
  .comoler{flex-direction:column;gap:4px}
  .controles{gap:10px 18px}
  .leitura b{font-size:16px}
  .eixo{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
